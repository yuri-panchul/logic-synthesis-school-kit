<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 910" role="img" aria-labelledby="title desc">
<title id="title">Тот же автомат в one-hot RTL</title>
<desc id="desc">S0 → S1 → S2 → S3 → S4 → S5 → S6 → S7 → S8 → S9 → S0. Асинхронный сброс из любого состояния в S0. Выходы: красный в S0–S3, жёлтый в S4–S5, зелёный в S6–S9.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#34596c"/></marker></defs>
<text x="40" y="55" font-family="DejaVu Sans,sans-serif" font-size="31" fill="#193244" text-anchor="start">Тот же автомат в one-hot RTL</text>
<text x="40" y="100" font-family="DejaVu Sans,sans-serif" font-size="23" fill="#193244" text-anchor="start">Каждая обычная стрелка: положительный фронт clk при rst = 0.</text>
<text x="40" y="140" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#193244" text-anchor="start">Сброс: rst = 1, из любого состояния (включая S0), без ожидания фронта.</text>
<path d="M 200 155 V 187" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-reset="any-to-S0"/>
<path d="M 293 280 H 372" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S0" data-to="S1" data-event="posedge clk; rst=0"/>
<text x="332.5" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S0" data-bits="0000000001" data-outputs="100"><circle cx="200" cy="280" r="88" fill="#fff0f3" stroke="#b92c43" stroke-width="3"/>
<text x="200" y="263" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#b92c43" text-anchor="middle">S0</text>
<text x="200" y="296" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b92c43" text-anchor="middle">0000000001</text>
</g>
<path d="M 558 280 H 637" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S1" data-to="S2" data-event="posedge clk; rst=0"/>
<text x="597.5" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S1" data-bits="0000000010" data-outputs="100"><circle cx="465" cy="280" r="88" fill="#fff0f3" stroke="#b92c43" stroke-width="3"/>
<text x="465" y="263" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#b92c43" text-anchor="middle">S1</text>
<text x="465" y="296" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b92c43" text-anchor="middle">0000000010</text>
</g>
<path d="M 823 280 H 902" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S2" data-to="S3" data-event="posedge clk; rst=0"/>
<text x="862.5" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S2" data-bits="0000000100" data-outputs="100"><circle cx="730" cy="280" r="88" fill="#fff0f3" stroke="#b92c43" stroke-width="3"/>
<text x="730" y="263" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#b92c43" text-anchor="middle">S2</text>
<text x="730" y="296" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b92c43" text-anchor="middle">0000000100</text>
</g>
<path d="M 1088 280 H 1167" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S3" data-to="S4" data-event="posedge clk; rst=0"/>
<text x="1127.5" y="263" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S3" data-bits="0000001000" data-outputs="100"><circle cx="995" cy="280" r="88" fill="#fff0f3" stroke="#b92c43" stroke-width="3"/>
<text x="995" y="263" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#b92c43" text-anchor="middle">S3</text>
<text x="995" y="296" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#b92c43" text-anchor="middle">0000001000</text>
</g>
<path d="M 1260 373 V 527" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S4" data-to="S5" data-event="posedge clk; rst=0"/>
<text x="1286" y="457.0" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="start">clk ↑</text>
<g id="state-S4" data-bits="0000010000" data-outputs="010"><circle cx="1260" cy="280" r="88" fill="#fff7d9" stroke="#8e6400" stroke-width="3"/>
<text x="1260" y="263" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#8e6400" text-anchor="middle">S4</text>
<text x="1260" y="296" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#8e6400" text-anchor="middle">0000010000</text>
</g>
<path d="M 1167 620 H 1088" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S5" data-to="S6" data-event="posedge clk; rst=0"/>
<text x="1127.5" y="603" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S5" data-bits="0000100000" data-outputs="010"><circle cx="1260" cy="620" r="88" fill="#fff7d9" stroke="#8e6400" stroke-width="3"/>
<text x="1260" y="603" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#8e6400" text-anchor="middle">S5</text>
<text x="1260" y="636" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#8e6400" text-anchor="middle">0000100000</text>
</g>
<path d="M 902 620 H 823" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S6" data-to="S7" data-event="posedge clk; rst=0"/>
<text x="862.5" y="603" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S6" data-bits="0001000000" data-outputs="001"><circle cx="995" cy="620" r="88" fill="#e8f8ef" stroke="#087a55" stroke-width="3"/>
<text x="995" y="603" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#087a55" text-anchor="middle">S6</text>
<text x="995" y="636" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#087a55" text-anchor="middle">0001000000</text>
</g>
<path d="M 637 620 H 558" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S7" data-to="S8" data-event="posedge clk; rst=0"/>
<text x="597.5" y="603" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S7" data-bits="0010000000" data-outputs="001"><circle cx="730" cy="620" r="88" fill="#e8f8ef" stroke="#087a55" stroke-width="3"/>
<text x="730" y="603" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#087a55" text-anchor="middle">S7</text>
<text x="730" y="636" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#087a55" text-anchor="middle">0010000000</text>
</g>
<path d="M 372 620 H 293" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S8" data-to="S9" data-event="posedge clk; rst=0"/>
<text x="332.5" y="603" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="middle">clk ↑</text>
<g id="state-S8" data-bits="0100000000" data-outputs="001"><circle cx="465" cy="620" r="88" fill="#e8f8ef" stroke="#087a55" stroke-width="3"/>
<text x="465" y="603" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#087a55" text-anchor="middle">S8</text>
<text x="465" y="636" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#087a55" text-anchor="middle">0100000000</text>
</g>
<path d="M 200 527 V 373" fill="none" stroke="#34596c" stroke-width="2.5" marker-end="url(#arrow)" data-from="S9" data-to="S0" data-event="posedge clk; rst=0"/>
<text x="226" y="457.0" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#193244" text-anchor="start">clk ↑</text>
<g id="state-S9" data-bits="1000000000" data-outputs="001"><circle cx="200" cy="620" r="88" fill="#e8f8ef" stroke="#087a55" stroke-width="3"/>
<text x="200" y="603" font-family="DejaVu Sans,sans-serif" font-size="29" fill="#087a55" text-anchor="middle">S9</text>
<text x="200" y="636" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#087a55" text-anchor="middle">1000000000</text>
</g>
<text x="730" y="423" font-family="DejaVu Sans,sans-serif" font-size="25" fill="#193244" text-anchor="middle">Одно состояние = один период такта</text>
<text x="730" y="464" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#193244" text-anchor="middle">4 красных → 2 жёлтых → 4 зелёных → повтор</text>
<text x="40" y="780" font-family="DejaVu Sans,sans-serif" font-size="27" fill="#193244" text-anchor="start">next_state = { state [8:0], state [9] };</text>
<text x="40" y="824" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#193244" text-anchor="start">Внутри вершины: state [9:0]. Единица сдвигается влево; бит 9 возвращается в бит 0.</text>
<text x="40" y="868" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#193244" text-anchor="start">Это кодирование обобщённого RTL, а не внутренние биты счётчика Джонсона физической 4017.</text>
</svg>
