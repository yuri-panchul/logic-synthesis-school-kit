<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="pinout" viewBox="0 0 376 282" width="376" height="282" role="img" aria-label="Pins of the 4071, seen from above with the notch on the left"><style>svg{font-family:"DejaVu Sans",Arial,sans-serif}
.fig-wrap{overflow-x:auto;border:1px solid #cfd5d9;border-radius:10px;background:#ffffff;margin:14px 0 6px;
padding:8px}
svg.arb{display:block;width:100%;min-width:900px;height:auto}
svg.arb text{font-family:"DejaVu Sans",Arial,sans-serif}
.s-gate,.s-chip{fill:#ffffff;stroke:#1c2329;stroke-width:1.6}
.s-chip{stroke-width:1.8}.s-notch{fill:#ffffff;stroke:#1c2329;stroke-width:1.4}
.s-line{stroke:#1c2329;stroke-width:1.4;fill:none}
.s-w{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.s-pow{stroke:#1c2329;stroke-width:1.5;fill:none}.s-vdd{stroke:#e03131;stroke-width:1.8;fill:none}
.s-led{fill:#ffffff;stroke:#1c2329;stroke-width:1.4}
.s-cloud{fill:#e5f2ec;stroke:#0b6e4f;stroke-width:1.2;stroke-dasharray:6 5;opacity:.85}
.s-cloud2{fill:#fdf1e3;stroke:#9a4d00;stroke-width:1.2;stroke-dasharray:6 5;opacity:.85}
.s-cap{fill:#5d6872;font-size:10.5px;letter-spacing:.08em;font-weight:700}
.s-tag{fill:#1c2329;font-size:12px;font-weight:700}.s-tag2{fill:#1c2329;font-size:8.5px;font-weight:700}
.s-sub{fill:#5d6872;font-size:10.5px}.s-io{fill:#1c2329;font-size:12.5px;font-weight:600}
.s-pin{fill:#1c2329;font-size:11px;font-weight:600}.s-pin2{fill:#1c2329;font-size:8px}
.s-pn{fill:#5d6872;font-size:8px}.s-chipname{fill:#1c2329;font-size:12px;font-weight:700}
.s-mod{fill:#f0f2f1;stroke:#cfd5d9;stroke-width:1.2}.s-modt{fill:#1c2329;font-size:8.5px;font-weight:600}
.ol{text-decoration:overline}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin:8px 0 4px}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.sw{display:inline-block;width:14px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.legend .sw{margin-right:0}
table.wires td{padding:4px 10px}table.wires tr.grp td{background:#f0f2f1}
table.wires tr.done td{opacity:.45}
.wchk{width:16px;height:16px;margin:0;accent-color:#0b6e4f}
ol.steps li{margin:6px 0}
pre.code{background:#eef1f3;border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.45}
.eq{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:#eef1f3;
padding:10px 14px;border-radius:8px;display:block;line-height:1.7;overflow-x:auto}
@media print{.fig-wrap{overflow:visible}svg.arb{min-width:0}}

svg .s-pn2{fill:#5d6872;font-size:10px}
svg .s-pinname{font-size:12px;font-weight:700}
svg .s-statek{fill:#1c2329;font-size:14px;font-weight:700}
svg .s-arrow{fill:#1c2329}
svg.wave text{font-family:"DejaVu Sans",Arial,sans-serif}
.w-edge{stroke:#cfd5d9;stroke-width:1;stroke-dasharray:2 3}
.w-lab{fill:#1c2329;font-size:12px;font-weight:600}
.w-line{fill:none;stroke-width:2;stroke-linejoin:round}
.w-bus{fill:#ffffff;stroke-width:1.6}
.w-val{fill:#1c2329;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.w-x{fill:#5d6872;opacity:.25}
.w-note{fill:#5d6872;font-size:11px}
